<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal de Pizzerías en Hidalgo - Mapbox API</title>
    
    <!-- Mapbox GL JS API CSS y JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel Lateral */
        #sidebar {
            width: 400px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .header {
            background: #d84315;
            color: white;
            padding: 18px 20px;
        }

        .header h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.82rem;
            opacity: 0.9;
        }

        /* Controles de Filtros */
        .controls {
            padding: 12px 15px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box input, .select-box select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            background: white;
        }

        .search-box input:focus, .select-box select:focus {
            border-color: #d84315;
        }

        /* Barra de Mapbox Style Selector y Reset */
        .map-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .btn-reset {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #1b5e20;
        }

        /* Indicadores / Dashboard Metrics */
        .metrics-bar {
            display: flex;
            background: #f0f4f8;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 15px;
            justify-content: space-between;
            text-align: center;
        }

        .metric-item {
            flex: 1;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d84315;
        }

        .metric-label {
            font-size: 0.72rem;
            color: #666;
            text-transform: uppercase;
        }

        /* Lista de Pizzerías */
        #pizzeria-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .pizza-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pizza-card:hover {
            border-color: #d84315;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .pizza-card h3 {
            font-size: 0.98rem;
            color: #222;
            margin-bottom: 4px;
        }

        .pizza-card p {
            font-size: 0.81rem;
            color: #555;
            margin-bottom: 4px;
        }

        .pizza-info-extra {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 6px;
        }

        .badges-container {
            display: flex;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.72rem;
            border-radius: 12px;
            background: #fbe9e7;
            color: #d84315;
            font-weight: bold;
        }

        .badge-muni {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Contenedor del Mapa Mapbox */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Popups de Mapbox */
        .mapboxgl-popup-content {
            padding: 14px;
            border-radius: 8px;
            max-width: 240px;
        }

        .popup-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #d84315;
            margin-bottom: 4px;
        }

        .popup-address {
            font-size: 0.82rem;
            color: #444;
            margin-bottom: 6px;
        }

        .popup-phone {
            font-size: 0.78rem;
            color: #666;
            margin-bottom: 8px;
        }

        .popup-btn {
            display: inline-block;
            background: #d84315;
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Panel de Control Lateral -->
    <div id="sidebar">
        <div class="header">
            <h1>🍕 Pizzerías en Hidalgo</h1>
            <p>Geoportal Estatal de Servicios | Node.js & Mapbox GL JS</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar pizzería, colonia o marca..." oninput="applyFilters()">
            </div>

            <div class="select-box">
                <select id="muniSelect" onchange="applyFilters()">
                    <option value="todos">Todos los Municipios de Hidalgo</option>
                    <option value="Pachuca de Soto">Pachuca de Soto</option>
                    <option value="Tulancingo de Bravo">Tulancingo de Bravo</option>
                    <option value="Tula de Allende">Tula de Allende</option>
                    <option value="Tizayuca">Tizayuca</option>
                    <option value="Actopan">Actopan</option>
                    <option value="Mineral del Monte">Mineral del Monte</option>
                </select>
            </div>

            <div class="map-tools">
                <div class="select-box" style="flex:1;">
                    <select id="styleSelect" onchange="changeMapStyle(this.value)">
                        <option value="mapbox://styles/mapbox/streets-v12">Mapa Calles</option>
                        <option value="mapbox://styles/mapbox/satellite-streets-v12">Satélite Vectorial</option>
                        <option value="mapbox://styles/mapbox/dark-v11">Modo Oscuro</option>
                    </select>
                </div>
                <button class="btn-reset" onclick="fitHidalgoBounds()">Ver Hidalgo 🗺️</button>
            </div>
        </div>

        <!-- Dashboard / Métricas -->
        <div class="metrics-bar">
            <div class="metric-item">
                <div class="metric-value" id="count-visible">0</div>
                <div class="metric-label">Pizzerías</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="count-munis">0</div>
                <div class="metric-label">Municipios</div>
            </div>
        </div>

        <div id="pizzeria-list">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <script>
  mapboxgl.accessToken = 'pk.eyJ1IjoicGF1bGluYTExMDUiLCJhIjoiY212NzRvbXAzMDM0cTJ6cTBkZnJkaXMzNSJ9.SLmoTlurwiYBsvX-knrKSw';
    let geojsonData = { type: "FeatureCollection", features: [] };
    const markers = [];

    // Mapa enfocado inicialmente en el Estado de Hidalgo
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [-98.7592, 20.1165], // Coordenadas iniciales
        zoom: 9.5
    });

    map.addControl(new mapboxgl.NavigationControl());

    // Cargar datos GeoJSON desde el servidor Node.js
    map.on('load', () => {
        fetch('/pizzerias_pachuca.geojson')
            .then(res => res.json())
            .then(data => {
                geojsonData = data;
                applyFilters();
            })
            .catch(err => console.error("Error al cargar GeoJSON:", err));
    });

    // Función para cambiar el estilo del mapa dinámicamente
    function changeMapStyle(styleUrl) {
        map.setStyle(styleUrl);
    }

    // Centrado inteligente que abarca todos los puntos en Hidalgo
    function fitHidalgoBounds() {
        if (!geojsonData.features.length) return;
        
        const bounds = new mapboxgl.LngLatBounds();
        geojsonData.features.forEach(f => bounds.extend(f.geometry.coordinates));
        map.fitBounds(bounds, { padding: 50, maxZoom: 14 });
    }

    // Filtrado combinado (Búsqueda por texto + Municipio)
    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const selectedMuni = document.getElementById('muniSelect').value;

        const filtered = geojsonData.features.filter(f => {
            const p = f.properties;
            const name = (p.name || "").toLowerCase();
            const address = (p.address || "").toLowerCase();
            const colonia = (p.colonia || "").toLowerCase();
            const brand = (p.brand || "").toLowerCase();
            const municipio = p.municipio || "";

            const matchesText = name.includes(query) || address.includes(query) || colonia.includes(query) || brand.includes(query);
            const matchesMuni = (selectedMuni === 'todos') || (municipio === selectedMuni);

            return matchesText && matchesMuni;
        });

        renderListAndMarkers(filtered);
    }

    function renderListAndMarkers(features) {
        const listContainer = document.getElementById('pizzeria-list');
        listContainer.innerHTML = '';
        markers.forEach(m => m.remove());
        markers.length = 0;

        // Actualizar métricas del dashboard
        document.getElementById('count-visible').innerText = features.length;
        const uniqueMunis = new Set(features.map(f => f.properties.municipio));
        document.getElementById('count-munis').innerText = uniqueMunis.size;

        features.forEach(feature => {
            const props = feature.properties;
            const coords = feature.geometry.coordinates;

            const card = document.createElement('div');
            card.className = 'pizza-card';
            card.innerHTML = `
                <h3>${props.name}</h3>
                <p>📍 ${props.address} (${props.colonia})</p>
                <div class="pizza-info-extra">📞 ${props.telefono} | 🕒 ${props.horario}</div>
                <div class="badges-container">
                    <span class="badge">${props.brand}</span>
                    <span class="badge badge-muni">${props.municipio}</span>
                </div>
            `;
            card.onclick = () => flyToLocation(coords);
            listContainer.appendChild(card);

            const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
                <div class="popup-title">${props.name}</div>
                <div class="popup-address">${props.address}, ${props.municipio}</div>
                <div class="popup-phone">📞 ${props.telefono}</div>
                <a class="popup-btn" href="https://www.google.com/maps/search/?api=1&query=${coords[1]},${coords[0]}" target="_blank">Cómo llegar</a>
            `);

            const marker = new mapboxgl.Marker({ color: '#d84315' })
                .setLngLat(coords)
                .setPopup(popup)
                .addTo(map);

            markers.push(marker);
        });
    }

    function flyToLocation(coords) {
        map.flyTo({
            center: coords,
            zoom: 15.5,
            essential: true
        });
    }
</script>
</body>
</html>
