    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel Lateral */
        #sidebar {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .header {
            background: #e65100;
            color: white;
            padding: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #e65100;
        }

        /* Lista de Pizzerías */
        #pizzeria-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .pizza-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pizza-card:hover {
            border-color: #e65100;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .pizza-card h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 4px;
        }

        .pizza-card p {
            font-size: 0.82rem;
            color: #666;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 12px;
            background: #fff3e0;
            color: #e65100;
            font-weight: bold;
        }

        /* Contenedor del Mapa Mapbox */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Popups de Mapbox */
        .mapboxgl-popup-content {
            padding: 15px;
            border-radius: 8px;
        }

        .popup-title {
            font-weight: bold;
            font-size: 1rem;
            color: #d84315;
            margin-bottom: 5px;
        }

        .popup-address {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
        }

        .popup-btn {
            display: inline-block;
            background: #e65100;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>

            { "type": "Feature", "properties": { "id": 35, "nombre": "Pizzería La Sierra", "brand": "Local", "direccion": "Av. Ferrocarril Central 500", "rating": 4.1 }, "geometry": { "type": "Point", "coordinates": [-98.7420, 20.0980] } }
        ]
    };

    // Inicializar Mapa de Mapbox GL JS centrado en Pachuca de Soto
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [-98.7592, 20.1165],
        zoom: 12.2
    });

    map.addControl(new mapboxgl.NavigationControl());

    const markers = [];

    map.on('load', () => {
        renderListAndMarkers(pizzeriasGeoJSON.features);
    });

    function renderListAndMarkers(features) {
        const listContainer = document.getElementById('pizzeria-list');
        listContainer.innerHTML = '';
        markers.forEach(m => m.remove());
        markers.length = 0;

        features.forEach(feature => {
            const props = feature.properties;
            const coords = feature.geometry.coordinates;

            const card = document.createElement('div');
            card.className = 'pizza-card';
            card.innerHTML = `
                <h3>${props.nombre}</h3>
                <p>${props.direccion}</p>
                <span class="badge">${props.brand}</span> ⭐ ${props.rating}
            `;
            card.onclick = () => flyToLocation(coords, props);
            listContainer.appendChild(card);

            const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
                <div class="popup-title">${props.nombre}</div>
                <div class="popup-address">${props.direccion}</div>
                <a class="popup-btn" href="https://www.google.com/maps/search/?api=1&query=${coords[1]},${coords[0]}" target="_blank">Cómo llegar</a>
            `);

            const marker = new mapboxgl.Marker({ color: '#e65100' })
                .setLngLat(coords)
                .setPopup(popup)
                .addTo(map);

            markers.push(marker);
        });
    }

    function flyToLocation(coords, props) {
        map.flyTo({
            center: coords,
            zoom: 15.5,
            essential: true
        });
    }

    function filterPizzerias() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = pizzeriasGeoJSON.features.filter(f => 
            f.properties.nombre.toLowerCase().includes(query) ||
            f.properties.direccion.toLowerCase().includes(query) ||
            f.properties.brand.toLowerCase().includes(query)
        );
        renderListAndMarkers(filtered);
    }
</script>
</body>
</html>
